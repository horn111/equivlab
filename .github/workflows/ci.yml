name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  analyzer-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install test runner
        run: python -m pip install -r requirements-ci.txt
      - name: Run dependency-free analyzer and contract tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest
      - name: Build compact deployment source
        run: python tools/build_deployment_contract.py
      - name: Verify compact deployment source against the contract suite
        env:
          EQUIVLAB_CONTRACT_PATH: build/consensus_safety_registry.py
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest tests/contract

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
